<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>gp-e2e</title>
<style>
  /* Mirror the platform SegmentedTabs.module.css geometry the plugin's compact
     overrides depend on: relative track, absolutely positioned indicator. */
  [role="tablist"]{position:relative;display:grid;padding:4px;border-radius:8px;background:var(--dsw-alias-bg-module-platform,#e9eaec)}
  [role="tablist"]>.dsh-segmented-indicator{position:absolute;inset:4px auto 4px 4px;box-sizing:border-box;border:0.5px solid var(--dsw-alias-border-l3,#ccc);border-radius:6px;background:var(--dsw-alias-bg-layer-3,#fff);transition:transform 180ms ease;pointer-events:none}
  [role="tablist"]>.dsh-segmented-tab{position:relative;justify-content:center;height:34px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--dsw-alias-label-secondary,#666);font:inherit;font-size:14px;cursor:pointer}
  [role="tablist"]>.dsh-segmented-tab[aria-selected="true"]{color:var(--dsw-alias-label-primary,#111);font-weight:600}
</style>
</head>
<body>
<div id="tabbar"></div>
<div id="panel" style="width:1000px;height:600px;border:1px solid #333"></div>
<div id="pill"></div>
<script src="./react.production.min.js"></script>
<script src="./react-dom.production.min.js"></script>
<script src="./react-jsx-runtime.js"></script>
<script>
  // Module table the plugin's `require` resolves against.
  var MOD = {
    'react': window.React,
    'react-dom': window.ReactDOM,
    'react/jsx-runtime': window.jsxRuntime,
    // Lazy mermaid chunk stub: the production chunk is a package-local
    // /plugins route the file:// harness cannot serve, so require.async
    // resolves this in-table stand-in instead (same renderMermaid contract).
    '@xbzbing/dsh-git-panel/client.mermaid': {
      renderMermaid: function (source) {
        if (source.indexOf('broken') !== -1) return Promise.reject(new Error('parse error'));
        return Promise.resolve('<svg data-mermaid-stub="1"></svg>');
      },
    },
    // Official dsh MarkdownText is provided by the platform in production.
    // The isolated harness substitutes a minimal React render to test the UI toggle.
    '@deepseek-ai/dsh-client-ui-primitives': {
      FileTypeIcon: function (props) {
        // Give the stub a real box: a sizeless <svg> defaults to 300x150 and
        // would blow up any row it sits in (the review screenshots caught it).
        return window.React.createElement('svg', {
          'data-file-type': props.kind || props.path, 'aria-hidden': 'true',
          className: props.className,
          width: props.size || 16, height: props.size || 16, viewBox: '0 0 16 16',
          fill: 'none', stroke: 'currentColor', strokeWidth: 1.2, strokeLinejoin: 'round',
        }, window.React.createElement('path', { d: 'M4 2h5l3 3v9H4z' }));
      },
      languageForPath: function (path) { return /\.tsx?$/i.test(path) ? 'typescript' : undefined; },
      // Official dsh StateDot: the one loading glyph the shell draws. The stub
      // mirrors the real markup (svg[data-state] + track/arc circles, size 14
      // when ongoing) so the panel's loader can be asserted as "the platform
      // mark", not as a ring of our own. The animation itself belongs to the
      // platform's stylesheet, which the file:// harness does not load.
      StateDot: function (props) {
        var edge = props.size || (props.state === 'ongoing' ? 14 : 10);
        if (props.state === 'ongoing') {
          return window.React.createElement('svg', {
            className: props.className, 'data-state': 'ongoing', 'aria-hidden': 'true',
            width: edge, height: edge, viewBox: '0 0 24 24',
          }, window.React.createElement('g', { 'data-spinner-motion': '' },
            window.React.createElement('circle', { 'data-spinner-track': '', cx: 12, cy: 12, r: 9.5, fill: 'none', stroke: 'currentColor', strokeWidth: 2 }),
            window.React.createElement('circle', { 'data-spinner-arc': '', cx: 12, cy: 12, r: 9.5, fill: 'none', stroke: 'currentColor', strokeWidth: 2 })));
        }
        return window.React.createElement('span', {
          className: props.className, 'data-state': props.state, 'aria-hidden': 'true',
          style: { width: edge, height: edge, display: 'inline-block' },
        });
      },
      useCodeHighlighter: function (language) {
        return window.React.useCallback(function (code) {
          return language ? code.split('\n').map(function (line) {
            return [{ text: line, style: { color: 'var(--shiki-keyword)' } }];
          }) : undefined;
        }, [language]);
      },
      MarkdownText: function ({ text }) {
        return window.React.createElement('article', { 'data-markdown-rendered': '' },
          window.React.createElement('h1', null, text.replace(/^#\s*/, '').trim()));
      },
      // Official dsh Menu: a controlled anchored dropdown. The stub keeps the
      // observable contract the plugin relies on — a role="menu" surface with
      // role="menuitem" rows, onSelect(id), and onClose on Escape or an outside
      // pointerdown — so the e2e can drive open/pick/dismiss for real. The
      // anchor is rendered as-is; the plugin owns its aria-haspopup/aria-expanded.
      Menu: function (props) {
        window.React.useEffect(function () {
          if (!props.open) return undefined;
          var onKey = function (event) { if (event.key === 'Escape') props.onClose(); };
          var onDown = function (event) {
            var target = event.target;
            var inside = target && target.closest
              && (target.closest('.dsh-menu-root') || target.closest('.dsh-menu-list'));
            if (!inside) props.onClose();
          };
          document.addEventListener('keydown', onKey);
          document.addEventListener('pointerdown', onDown);
          return function () {
            document.removeEventListener('keydown', onKey);
            document.removeEventListener('pointerdown', onDown);
          };
        }, [props.open, props.onClose]);
        var items = props.items || [];
        var list = props.open ? window.React.createElement('div', {
          className: 'dsh-menu-list', role: 'menu', 'data-menu-surface': '',
        }, items.map(function (item) {
          var selected = item.id === props.selectedId;
          return window.React.createElement('button', {
            key: item.id, type: 'button', role: 'menuitem',
            className: selected ? 'dsh-menu-item dsh-menu-item--selected' : 'dsh-menu-item',
            'aria-checked': selected, disabled: item.disabled === true,
            onClick: function () { if (props.onSelect) props.onSelect(item.id); },
          }, item.label);
        })) : null;
        // Positional children, not an array: no key warnings from a wrapper.
        return window.React.createElement('span', { className: 'dsh-menu-root' }, props.anchor, list);
      },
      MenuItemButton: function (props) {
        return window.React.createElement('button', {
          type: 'button', role: 'menuitem', className: 'dsh-menu-item',
          disabled: props.disabled === true, onClick: props.onSelect,
        }, props.children);
      },
      IconChevronDownOutlineRegular: function (props) {
        return window.React.createElement('svg', {
          'data-chevron': '', 'aria-hidden': 'true', className: props.className,
          width: props.size || 14, height: props.size || 14,
        });
      },
      // Official closed/open folder glyphs: data-folder lets the e2e assert the
      // expanded state without depending on the icon package.
      IconFolderCloseRegular: function (props) {
        return window.React.createElement('svg', {
          'data-folder': 'closed', 'aria-hidden': 'true', className: props.className,
          width: props.size || 16, height: props.size || 16, viewBox: '0 0 16 16',
          fill: 'none', stroke: 'currentColor', strokeWidth: 1.4, strokeLinejoin: 'round',
        }, window.React.createElement('path', { d: 'M2 4.6h4l1.4 1.9H14v5.9H2z' }));
      },
      IconFolderOpenRegular: function (props) {
        return window.React.createElement('svg', {
          'data-folder': 'open', 'aria-hidden': 'true', className: props.className,
          width: props.size || 16, height: props.size || 16, viewBox: '0 0 16 16',
          fill: 'none', stroke: 'currentColor', strokeWidth: 1.4, strokeLinejoin: 'round',
        }, window.React.createElement('path', { d: 'M2 4.6h4l1.4 1.9H14l-1.1 5.9H2z' }));
      },
      // Official dsh SegmentedTabs: a controlled tab list with a sliding
      // indicator. The stub keeps the observable contract the plugin and the
      // e2e rely on — role="tablist" + aria-label, one aria-hidden indicator
      // span whose translateX tracks the active index, one role="tab" button per
      // item carrying aria-selected/aria-controls/tabIndex, click → onChange,
      // and the Arrow/Home/End walk — mirroring the shell's own implementation.
      SegmentedTabs: function (props) {
        var R = window.React;
        var items = props.items || [];
        var index = items.findIndex(function (item) { return item.value === props.value; });
        var walk = function (event, from) {
          var next;
          switch (event.key) {
            case 'ArrowLeft': next = (from + items.length - 1) % items.length; break;
            case 'ArrowRight': next = (from + 1) % items.length; break;
            case 'Home': next = 0; break;
            case 'End': next = items.length - 1; break;
            default: return;
          }
          event.preventDefault();
          var list = event.currentTarget.parentElement;
          var picked = items[next];
          if (list === null || picked === undefined) return;
          var buttons = list.querySelectorAll('[role="tab"]');
          if (buttons[next]) buttons[next].focus();
          props.onChange(picked.value);
        };
        return R.createElement('div', {
          role: 'tablist', 'aria-label': props.label, className: props.className,
          style: { gridTemplateColumns: 'repeat(' + items.length + ', minmax(0, 1fr))' },
        },
          R.createElement('span', {
            key: 'indicator', 'aria-hidden': 'true', className: 'dsh-segmented-indicator',
            style: {
              width: 'calc((100% - 8px) / ' + items.length + ')',
              transform: 'translateX(' + (index * 100) + '%)',
            },
          }),
          items.map(function (item, i) {
            var selected = props.value === item.value;
            return R.createElement('button', {
              key: item.value, id: item.id, type: 'button', role: 'tab',
              className: 'dsh-segmented-tab',
              'aria-selected': selected, 'aria-controls': item.panelId,
              tabIndex: selected ? 0 : -1,
              onClick: function () { props.onChange(item.value); },
              onKeyDown: function (event) { walk(event, i); },
            }, item.label);
          }));
      },
      // Official dsh SegmentedControl: equal-width mode segments with a sliding
      // indicator. Keeps the observable contract the plugin relies on —
      // role=tablist + aria-label, one role=tab per option whose id is
      // `<id>-<value>` and whose aria-controls names `<id>-<value>-panel`.
      SegmentedControl: function (props) {
        var R = window.React;
        var options = props.options || [];
        var walkSeg = function (event, from) {
          var next;
          switch (event.key) {
            case 'ArrowLeft': case 'ArrowUp': next = (from + options.length - 1) % options.length; break;
            case 'ArrowRight': case 'ArrowDown': next = (from + 1) % options.length; break;
            case 'Home': next = 0; break;
            case 'End': next = options.length - 1; break;
            default: return;
          }
          event.preventDefault();
          var target = options[next];
          if (target && target.value !== props.value) props.onChange(target.value);
        };
        return R.createElement('div', {
          role: 'tablist', 'aria-label': props.label, className: props.className,
          style: { gridTemplateColumns: 'repeat(' + options.length + ', minmax(0, 1fr))' },
        },
          R.createElement('span', { key: 'indicator', 'aria-hidden': 'true', className: 'dsh-segmented-indicator' }),
          options.map(function (option, i) {
            var active = props.value === option.value;
            return R.createElement('button', {
              key: option.value, id: props.id + '-' + option.value, type: 'button', role: 'tab',
              className: 'dsh-segmented-tab',
              'aria-selected': active, 'aria-controls': props.id + '-' + option.value + '-panel',
              tabIndex: active ? 0 : -1,
              disabled: props.disabled === true || option.disabled === true,
              title: option.title,
              onClick: function () { if (!active) props.onChange(option.value); },
              onKeyDown: function (event) { walkSeg(event, i); },
            }, option.label);
          }));
      },
      // Mirrors the platform's writeClipboard: the async Clipboard API when the
      // context has it, else the execCommand fallback a remote plain-HTTP
      // origin needs (there navigator.clipboard is undefined).
      writeClipboard: async function (text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try { await navigator.clipboard.writeText(text); return true } catch { return false }
        }
        if (typeof document.execCommand !== 'function') return false;
        var el = document.createElement('textarea');
        el.value = text;
        el.setAttribute('readonly', '');
        document.body.appendChild(el);
        el.select();
        try { return document.execCommand('copy') } catch { return false } finally { el.remove() }
      },
    },
  };
  var LOADED = null;
  // Real package-local chunks loaded by <script> (the editor chunk is the
  // shipped CodeMirror bundle, not a stand-in): chunk name -> exports, and the
  // pending loads waiting for a chunk's script to register.
  var CHUNKS = {};
  var CHUNK_WAITERS = {};
  function loadRealChunk(name) {
    if (CHUNKS[name]) return Promise.resolve(CHUNKS[name]);
    // A test can make the next chunk loads fail, the way a dropped network
    // request would, to exercise the retry path.
    if (window.__chunkFailures && window.__chunkFailures[name] > 0) {
      window.__chunkFailures[name]--;
      return Promise.reject(new Error('chunk load failed: ' + name));
    }
    return new Promise(function (resolve, reject) {
      (CHUNK_WAITERS[name] = CHUNK_WAITERS[name] || []).push(resolve);
      var script = document.createElement('script');
      script.src = './' + name;
      script.onerror = function () { reject(new Error('chunk load failed: ' + name)); };
      document.head.appendChild(script);
    });
  }
  window.__ModuleLoader__ = {
    load: function (entry) {
      var requireFn = function (id) {
        if (MOD[id]) return MOD[id];
        throw new Error('unknown module ' + id);
      };
      // Package-local lazy chunks (require.async('./client.<name>.js')),
      // mirroring the production client-modules import path.
      requireFn.async = function (spec) {
        if (spec === './client.mermaid.js') return Promise.resolve(MOD['@xbzbing/dsh-git-panel/client.mermaid']);
        if (spec === './client.editor.js') return loadRealChunk('client.editor.js');
        return Promise.reject(new Error('unknown chunk ' + spec));
      };
      if (entry.chunk) {
        CHUNKS[entry.chunk] = entry.factory(requireFn);
        (CHUNK_WAITERS[entry.chunk] || []).forEach(function (resolve) { resolve(CHUNKS[entry.chunk]); });
        CHUNK_WAITERS[entry.chunk] = [];
        return;
      }
      LOADED = entry.factory(requireFn);
    },
  };
  window.__getLoaded = function () { return LOADED; };
</script>
</body></html>
