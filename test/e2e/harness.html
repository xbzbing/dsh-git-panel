        // follows the snapshot" is invisible to e2e.

        for (var i = 0; i < state.actions.length; i++) if (state.actions[i].id === id) action = state.actions[i]

        // action (client.js: select sets the presence to null, then runs). A
        // stub that kept the popup "open" would let a run leave the panel in a
        // state the real platform never produces.
        service.close()

      },

        releaseObserved()
        state.last = null; state.offered = []; state.actions = []; state.pending = null

        service.close()

      requireFn.async = function (spec) {
