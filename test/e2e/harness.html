<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>gp-e2e</title></head>
<body>
<div id="tabbar"></div>
<div id="panel" style="width:1000px;height:600px;border:1px solid #333"></div>
<div id="pill"></div>
<script src="./react.production.min.js"></script>
<script src="./react-dom.production.min.js"></script>
<script src="./react-jsx-runtime.js"></script>
<script>
  // Module table the plugin's `require` resolves against.
  var MOD = {
    'react': window.React,
    'react-dom': window.ReactDOM,
    'react/jsx-runtime': window.jsxRuntime,
  };
  var LOADED = null;
  window.__ModuleLoader__ = {
    load: function (entry) {
      LOADED = entry.factory(function (id) {
        if (MOD[id]) return MOD[id];
        throw new Error('unknown module ' + id);
      });
    },
  };
  window.__getLoaded = function () { return LOADED; };
</script>
</body></html>
