name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    # Pinned, not `ubuntu-latest`: the rolling label migrates to 26.04 between
    # 2026-10-19 and 2026-11-19, and a silent image swap moves the git/npm
    # baseline the fixture tests sit on. Bump this line deliberately.
    # playwright-core 1.63 already lists ubuntu26.04, so the move is one line.
    runs-on: ubuntu-24.04
    # The unit runner deliberately omits `--test-force-exit` (it silently drops
    # in-flight tests), so a leaked handle would hang rather than fail; cap the
    # job instead of waiting out the 360-minute default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # package.json engines: ^22.19.0 || >=24.0.0
        node: ['22.x', '24.x']
    steps:
      # Node 20 is retired on the runners; @v4 of all three actions still targets
      # it and gets force-run on 24 with a deprecation warning. v7/v7/v6 are the
      # node24 builds. checkout's v7 fork-PR guard only applies to
      # pull_request_target / workflow_run, neither of which this workflow uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The lock is committed and guarded by test/unit/lock-sync.test.mjs;
      # @deepseek-ai/dsh is an optional peer, so this installs the devDeps and
      # the type-level platform peers only, never the harness tree.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  # E2E runs on one Node version: the harness drives the browser bundle over
  # file:// fixtures, so neither the runner nor the assertions read the host
  # Node version, while the matrix legs above already cover it for lint,
  # typecheck and the unit suite. A separate job also means one browser install
  # instead of two racing cache entries, and its pool keeps the wall clock near
  # the slowest runner rather than the sum of all of them.
  e2e:
    name: e2e (node 24.x)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          # A lockfile change (any dependency bump) must not throw away the
          # browser: the pinned playwright revision usually stays the same, and
          # a cold install spends minutes in apt + the CDN download.
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      # playwright-core ships no browsers, and the e2e runners launch chromium
      # themselves (no test runner, no display, file:// fixtures only).
      #
      # Install only when the expected browser binary is missing. `--with-deps`
      # re-runs apt every time, which is what turned one cache miss into a
      # nine-minute step; a restored cache (exact or via restore-keys) needs
      # neither apt nor a download, and a real playwright bump changes the
      # executable path so the install still runs.
      #
      # A hit skips apt on purpose. If a runner image moves a shared library
      # under the cached browser, every launch fails instead of self-healing —
      # clear this cache key when that happens.
      #
      # Headless launches use `chrome-headless-shell`, which is not the path
      # chromium.executablePath() reports; check both, or a partial cache passes
      # the guard and every runner fails to launch.
      - name: Install Chromium
        timeout-minutes: 12
        run: |
          CACHE="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          CHROME="$(node -p "require('playwright-core').chromium.executablePath()")"
          SHELL="$(find "$CACHE" -maxdepth 3 -type f -name 'chrome-headless-shell' -perm -u+x -print -quit 2>/dev/null)"
          if [ -x "$CHROME" ] && [ -n "$SHELL" ]; then
            echo "Chromium already present: $CHROME"
            echo "Headless shell already present: $SHELL"
          else
            npx --no-install playwright-core install --with-deps chromium
          fi

      - name: E2E tests
        run: npm run test:e2e
        env:
          # Four-vCPU runner: three slots leave the main process a core.
          E2E_CONCURRENCY: '3'

  # Unit tests only: the e2e runners and the lint / typecheck gates do not
  # depend on the host OS. The runner's token may create symlinks, so the
  # unprivileged-Windows skip path is exercised locally, not here.
  unit-windows:
    name: unit (windows, node 24.x)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      # Keep LF in the checkout: fixtures and goldens compare bytes.
      - name: Git line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:unit
